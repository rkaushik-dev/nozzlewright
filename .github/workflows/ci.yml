name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: format
        run: python scripts/checks.py format

      - name: lint
        run: python scripts/checks.py lint

      - name: types
        run: python scripts/checks.py types

      - name: tests
        run: python -m pytest -q --cov=nozzlewright --cov-report=term-missing --cov-report=xml

      - name: coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  windows:
    # The handheld tooling is run from a Windows laptop on half the sites, and
    # the two things that break there are line endings and the lack of
    # AF_BLUETOOTH. Both are covered by the suite, so it runs there too.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: tests
        run: python -m pytest -q

  migrations:
    # A schema that only exists because create_all built it is a schema no
    # gateway will ever have. This proves the migrations reach the same place.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: upgrade from empty
        run: |
          python -m nozzlewright.cli --state-dir ./ci-state db upgrade
          python -m nozzlewright.cli --state-dir ./ci-state db status

      - name: upgrade again is a no op
        run: python -m nozzlewright.cli --state-dir ./ci-state db upgrade

  smoke:
    # The suite can be green on a build that will not start. This brings the
    # whole gateway up against simulated machines and walks the endpoints.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: smoke
        run: python scripts/smoke.py

      - name: doctor on a fresh box
        run: |
          python -m nozzlewright.cli --state-dir ./ci-state db upgrade
          python -m nozzlewright.cli --state-dir ./ci-state doctor

      - name: the install files render
        run: python -m nozzlewright.cli --state-dir ./ci-state install --out ./ci-deploy

  image:
    # The Dockerfile is the other way this ships. Built on every push so it
    # cannot rot, and never pushed anywhere from here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: docker build --tag nozzlewright-gateway:ci .

      - name: the image can run the tool
        run: docker run --rm --entrypoint nozzlewright nozzlewright-gateway:ci --help
