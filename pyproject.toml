[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nozzlewright"
version = "0.1.0"
description = "Handheld fleet controller for Halvex thermal inkjet coding printers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Halvex Marking Systems" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "structlog==25.1.0",
    "anyio==4.8.0",
    "SQLAlchemy==2.0.38",
    "alembic==1.14.1",
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "typer==0.15.1",
    "prometheus-client==0.21.1",
]

[project.scripts]
nozzlewright = "nozzlewright.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "ruff==0.9.6",
    "mypy==1.15.0",
    "httpx==0.28.1",
    "pytest-cov==6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nozzlewright = ["py.typed", "storage/migrations/*.py", "storage/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["nozzlewright"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# Everything the formatter decides is a decision nobody has to make again.
# Double quotes and trailing commas because that is what it does by default and
# arguing with a formatter is how a team loses an afternoon.
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# B008 is the fastapi dependency idiom, which we use on purpose.
# UP031 wants f-strings everywhere. This code base formats with percent on
# purpose so the log calls and the exception messages read the same way, and a
# two hundred site rewrite to satisfy a style rule buys nothing.
ignore = ["B008", "UP031"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures spell out wire text and stored label source, and wrapping those
# hides what is being tested.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true

# SQLAlchemy models are built by a decorator and alembic scripts are generated,
# so neither has the annotations the rest of the code does. Everything else is
# checked at the same setting.
[[tool.mypy.overrides]]
module = ["nozzlewright.storage.migrations.*"]
ignore_errors = true
