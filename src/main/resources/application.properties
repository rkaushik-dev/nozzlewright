# The gateway's own settings come from NZW_* environment variables through Settings, and the services
# object holding the database, the registry and the keys is handed to the application when it starts.
# What is here is only how Spring itself should behave.
spring.application.name=nozzlewright
spring.main.banner-mode=off
server.error.whitelabel.enabled=false
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
